version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14
    container_name: fraud_postgres
    environment:
      POSTGRES_USER: fraud_admin
      POSTGRES_PASSWORD: fraud_secure_password_123
      POSTGRES_DB: fraud_detection_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - fraud_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud_admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: fraud_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - fraud_network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Flask API Backend
  flask_api:
    build: .
    container_name: fraud_flask_api
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://fraud_admin:fraud_secure_password_123@postgres:5432/fraud_detection_db
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: ${MINIO_BUCKET:-fraud-models}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-8}
      ANALYST_USERNAME: ${ANALYST_USERNAME:-analyst}
      ANALYST_PASSWORD: ${ANALYST_PASSWORD:-}
      ANALYST_PASSWORD_HASH: ${ANALYST_PASSWORD_HASH:-}
      ANALYST_API_KEY: ${ANALYST_API_KEY:-}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./xgb_model.pkl:/app/xgb_model.pkl:ro
      - ./scaler.pkl:/app/scaler.pkl:ro
      - ./fraud_detection.log:/app/fraud_detection.log
    networks:
      - fraud_network
    restart: unless-stopped

  # Nginx Reverse Proxy & Web Server
  nginx:
    image: nginx:alpine
    container_name: fraud_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./templates:/usr/share/nginx/html:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - flask_api
    networks:
      - fraud_network
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:

networks:
  fraud_network:
    driver: bridge